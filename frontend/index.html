<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Real-time collaborative LaTeX editing in your browser. Write and share documents with your team, hosted on your own server." />
  <link rel="canonical" href="https://sync-tex.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>SyncTeX - Collaborative LaTeX Editor</title>
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('theme_preference') || 'system';
        var isValid = preference === 'system' || preference === 'light' || preference === 'dark';

        if (!isValid) {
          preference = 'system';
        }

        var theme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
