syntax = "proto3";

package compaction;
option go_package = "projects-service/proto;proto";

service CompactionService {
  rpc CompactDocument(CompactRequest) returns (CompactResponse);
  rpc ExportDocument (ExportRequest)   returns (ExportResponse);
}


// CompactDocument

message CompactRequest {
  string download_url = 1;
  string upload_url = 2;
  string base_snapshot_url = 3;
}

message CompactResponse {
  bool   success              = 1;
  string error_message        = 2;
  uint32 updates_merged       = 3;
  uint64 compacted_size_bytes = 4;
}


// ExportDocument

message ExportRequest {
  // Each source URL is independently optional. An omitted URL means the
  // corresponding object was confirmed absent by projects-service; it must not
  // be replaced with a URL expected to return 404. A supplied URL is required
  // to be readable and malformed source data remains an error.
  string snapshot_url        = 1;
  string pending_updates_url = 2;
  string upload_url          = 3;
}

message ExportResponse {
  bool   success        = 1;
  string error_message  = 2;
  uint64 exported_bytes = 3;
}
