services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/conf.d/frontend.dev.conf:/etc/nginx/conf.d/frontend.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-users:
    ports:
      - "127.0.0.1:5434:5432"

  users-service:
    build:
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ./users-service:/app
      - /app/__pycache__
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8001
      --reload

  postgres-projects:
    ports:
      - "5433:5432"

  projects-service:
    build:
      dockerfile: Dockerfile.dev
    ports:
      - "8003:8003"
    volumes:
      - ./projects-service:/app
      - /app/tmp
    command: air -c .air.toml

  collab-service:
    build:
      dockerfile: Dockerfile.dev
    environment:
      RUST_LOG: debug
    volumes:
      - ./collab-service:/app
      - collab_build_cache:/app/target
    command: air -c .air.toml

  file-data-service:
    build:
      dockerfile: Dockerfile.dev
    environment:
      RUST_LOG: debug
    ports:
      - "50051:50051"
    volumes:
      - ./file-data-service/src:/app/src
      - ./proto:/app/proto
      - file_data_target:/app/target
    command: sh -c "touch src/main.rs && cargo watch -x run"

  postgres-assistant:
    ports:
      - "5435:5432"

  assistant-service:
    build:
      dockerfile: Dockerfile.dev
    environment:
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    volumes:
      - ./assistant-service:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    mem_limit: 512m

volumes:
  collab_build_cache:
  file_data_target:
