services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      users-service:
        condition: service_started
      projects-service:
        condition: service_started
      collab-service:
        condition: service_started
      assistant-service:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - gateway-network

  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  users-service:
    build:
      context: ./users-service
    environment:
      DATABASE_URL: ${USERS_DB_URL}
      EXTERNAL_URL: ${EXTERNAL_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SECRET_KEY: ${USERS_SECRET_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${EXTERNAL_URL}/auth/github/callback
      USERS_INTERNAL_API_KEY: ${USERS_INTERNAL_API_KEY}
    depends_on:
      postgres-users:
        condition: service_healthy
    networks:
      - gateway-network

  postgres-projects:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PROJECTS_DB_USER}
      POSTGRES_PASSWORD: ${PROJECTS_DB_PASSWORD}
      POSTGRES_DB: ${PROJECTS_DB}
    volumes:
      - postgres_projects_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  projects-service:
    build:
      context: ./projects-service
    environment:
      DATABASE_URL: ${PROJECTS_DB_URL}
      JWT_SECRET: ${USERS_SECRET_KEY}
      PORT: ${PROJECTS_PORT:-8003}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      GATEWAY_URL: ${EXTERNAL_URL}
      USERS_INTERNAL_API_KEY: ${USERS_INTERNAL_API_KEY}
      USERS_INTERNAL_API_URL: ${USERS_INTERNAL_API_URL}
      FILE_DATA_ADDR: ${FILE_DATA_ADDR:-file-data-service:50051}
      EXTERNAL_URL: ${EXTERNAL_URL}
      PROJECTS_INTERNAL_API_KEY: ${PROJECTS_INTERNAL_API_KEY}
    depends_on:
      postgres-projects:
        condition: service_healthy
      file-data-service:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - gateway-network

  collab-service:
    build:
      context: ./collab-service
    environment:
      BIND_ADDR: ${COLLAB_SERVICE_BIND_ADDR}
      PROJECTS_SERVICE_URL: ${PROJECTS_SERVICE_URL:-http://projects-service:8003}
      UPLOAD_DEBOUNCE_MS: ${COLLAB_UPLOAD_DEBOUNCE_MS}
      UPLOAD_MAX_INTERVAL_SECS: ${COLLAB_UPLOAD_MAX_SEC}
    depends_on:
      projects-service:
        condition: service_started
    networks:
      - gateway-network

  file-data-service:
    build:
      context: ./file-data-service
      additional_contexts:
        root-proto: ./proto # Pass in shared proto definition from project root
    environment:
      GRPC_ADDR: ${FILE_DATA_GRPC_ADDR:-[::]:50051}
    networks:
      - gateway-network

  postgres-assistant:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${ASSISTANT_DB_USER}
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD}
      POSTGRES_DB: ${ASSISTANT_DB}
    volumes:
      - postgres_assistant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  assistant-service:
    build:
      context: ./assistant-service
    environment:
      DATABASE_URL: ${ASSISTANT_DB_URL}
      DATABASE_SYNC_URL: ${ASSISTANT_DB_SYNC_URL}
      ASSISTANT_ENCRYPTION_KEY: ${ASSISTANT_ENCRYPTION_KEY}
      JWT_SECRET: ${USERS_SECRET_KEY}
      JWT_ALGORITHM: HS256
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      PROJECTS_SERVICE_URL: ${PROJECTS_SERVICE_URL:-http://projects-service:8003}
      PROJECTS_INTERNAL_API_KEY: ${PROJECTS_INTERNAL_API_KEY}
    depends_on:
      postgres-assistant:
        condition: service_healthy
      projects-service:
        condition: service_started
    networks:
      - gateway-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

volumes:
  postgres_users_data:
  postgres_projects_data:
  postgres_assistant_data:
  minio_data:

networks:
  gateway-network:
    driver: bridge
